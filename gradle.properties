# Starveil — modern Gradle defaults.
android.useAndroidX=true
# Non-transitive R classes: each module only sees its own resources.
android.nonTransitiveRClass=true
# Keep BuildConfig out of libraries; app does not need it either for this skeleton.
android.defaults.buildfeatures.buildconfig=false
# Official Kotlin code style.
kotlin.code.style=official
# Build performance.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
