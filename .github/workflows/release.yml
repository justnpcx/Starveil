name: Release

# Tags only. A release is a decision, not something every push produces, and
# the update checker reads exactly these — a version that exists in the app but
# not in Releases is a version nobody can update to.
on:
  push:
    tags: ["v*"]

permissions:
  # Creating the release, and uploading the APKs to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The key is a secret, so it arrives base64-encoded and is written to a
      # temp file that only this job can see.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STARVEIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::STARVEIL_KEYSTORE_BASE64 is not set; refusing to build an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STARVEIL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          STARVEIL_KEYSTORE_PASSWORD: ${{ secrets.STARVEIL_KEYSTORE_PASSWORD }}
          STARVEIL_KEY_ALIAS: ${{ secrets.STARVEIL_KEY_ALIAS }}
          STARVEIL_KEY_PASSWORD: ${{ secrets.STARVEIL_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # Three ABIs, three files. A regression in the splits block would
      # otherwise publish one APK and the release would look fine.
      - name: Expect three ABI APKs
        run: |
          count=$(ls app/build/outputs/apk/release/*.apk | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 ABI APKs, found $count"
            ls -la app/build/outputs/apk/release
            exit 1
          fi

      # The updater picks the asset whose name contains the device's own ABI,
      # so the suffix is the contract between this step and the app.
      - name: Name the APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/starveil-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la dist

      # A checksum file beside the binaries. The updater already verifies
      # SHA-256 of what it downloads, but a user who saves an APK by hand has
      # nothing to compare against. Generated from dist/ rather than committed,
      # so it can only ever describe the three files in this release — a stale
      # checksum file is worse than none, because it fails for the wrong reason.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS

      # Kept out of the release itself: it maps obfuscated names back to real
      # ones, which is exactly what a crash report needs and what an attacker
      # would like to have.
      #
      # Ninety days, stated rather than inherited: a mapping file is only
      # useful while the build it describes is still on someone's phone, and a
      # crash report from that build can arrive months later. It is 4 MB, so it
      # is not what the storage warning was about — the debug APKs were.
      - name: Keep the mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # The source repository is public, so the release belongs here: the
      # updater reads `releases/latest` without a token, and a public
      # repository answers it. Publishing immediately because `latest` ignores
      # drafts, and the app has no notion of a draft to wait for.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Starveil ${{ github.ref_name }}
          body: |
            APKs for the three supported ABIs, plus SHA256SUMS (run
            sha256sum -c SHA256SUMS in the download directory to verify them).
            What changed is in
            [CHANGELOG.md](https://github.com/justnpcx/Starveil/blob/main/CHANGELOG.md).
          files: dist/*
          draft: false
          make_latest: true
