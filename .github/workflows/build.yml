name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list is "tools platform-tools", but Google
          # removed the legacy "tools" package from the SDK repository, so the
          # step died on `sdkmanager tools` before anything was built. Install
          # exactly what the pinned compileSdk/build-tools require instead.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Neither gap is visible in a build that only ever runs in one locale:
      # a missing key falls back to English, and a translation that drops
      # `%1$s` compiles fine and throws when the screen is opened in Chinese.
      - name: Translations
        run: ./gradlew checkTranslations --no-daemon
      # The same rule as the keystore: what must not be in the repository is
      # cheapest to catch on every push, before it is in a release or a fork.
      # The script names each pattern and why it exists.
      - name: Leak scan
        run: ./scripts/leak-scan.sh
      # No signing, no secrets, no keystore: CI only proves the skeleton compiles.
      # Use the wrapper so CI and local builds share the pinned Gradle 8.13.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      # The tests were only ever run by hand until now, which is how a
      # regression in the config builder could reach main unnoticed.
      #
      # --rerun-tasks on purpose: the Gradle build cache was serving every
      # testDebugUnitTest FROM-CACHE, so this step was reporting a previous
      # run's result rather than checking anything. A cache hit is sound for
      # hermetic tests, but CI's job is to be the independent check, and a
      # cached success also hides flakiness and anything a test reads that is
      # not a declared input (time, timezone, environment).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --rerun-tasks
      # The CI watcher is shell, so Gradle does not cover it. It has its own
      # tests (no network, no credentials) and they run here rather than being
      # something only remembered by hand.
      - name: CI watcher tests
        run: bash scripts/ci-watch.test.sh
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
      # Sideload build: the debug APKs are debug-signed, so they install on a
      # device without any signing secrets in CI. One APK per ABI — a single
      # universal APK would be ~230 MB of native code.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: starveil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
