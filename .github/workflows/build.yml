name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list is "tools platform-tools", but Google
          # removed the legacy "tools" package from the SDK repository, so the
          # step died on `sdkmanager tools` before anything was built. Install
          # exactly what the pinned compileSdk/build-tools require instead.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # No signing, no secrets, no keystore: CI only proves the skeleton compiles.
      # Use the wrapper so CI and local builds share the pinned Gradle 8.13.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      # The tests were only ever run by hand until now, which is how a
      # regression in the config builder could reach main unnoticed.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      # The CI watcher is shell, so Gradle does not cover it. It has its own
      # tests (no network, no credentials) and they run here rather than being
      # something only remembered by hand.
      - name: CI watcher tests
        run: bash scripts/ci-watch.test.sh
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
      # Sideload build: the debug APK is debug-signed, so it installs on a
      # device without any signing secrets in CI.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
