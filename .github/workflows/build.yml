name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # No signing, no secrets, no keystore: CI only proves the skeleton compiles.
      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon
      - name: Lint
        run: gradle lintDebug --no-daemon
