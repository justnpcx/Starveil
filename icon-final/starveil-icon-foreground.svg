<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!--
    Adaptive foreground layer, 108 canvas.
    Derived from the delivered monochrome master: the same star, the same
    transform (translate 18.36, scale .7128) and the same concentric cutout
    (translate 37.8, scale .324). Only the fill is different — white instead
    of the tinted silhouette — because this layer paints the star itself.
  -->
  <defs><mask id="starmask">
      <g transform="translate(18.36 18.36) scale(.7128)"><path d="M50 5 C59.5 35.5 64.5 40.5 95 50 C64.5 59.5 59.5 64.5 50 95 C40.5 64.5 35.5 59.5 5 50 C35.5 40.5 40.5 35.5 50 5 Z" fill="white"/></g>
      <g transform="translate(37.8 37.8) scale(.324)"><path d="M50 5 C59.5 35.5 64.5 40.5 95 50 C64.5 59.5 59.5 64.5 50 95 C40.5 64.5 35.5 59.5 5 50 C35.5 40.5 40.5 35.5 50 5 Z" fill="black"/></g>
  </mask></defs>
  <rect width="108" height="108" fill="#FFFFFF" mask="url(#starmask)"/>
</svg>
